version: 2.1
jobs:
  build:
    docker:
      - image: cimg/go:1.27
      - image: rabbitmq:3-alpine

    steps:
      - checkout

      - run:
          name: Get go deps
          command: go mod download

      - run:
          name: Vet
          command: go vet ./...

      - run:
          name: Wait for RabbitMQ
          command: |
            for i in $(seq 1 60); do
              (echo > /dev/tcp/localhost/5672) >/dev/null 2>&1 && exit 0
              sleep 2
            done
            echo "RabbitMQ did not start in time"
            exit 1

      - run:
          name: Unit tests
          command: |
            go install github.com/jstemmer/go-junit-report/v2@latest
            mkdir -p test-results/junit
            go test ./... -v 2>&1 | go-junit-report -set-exit-code > test-results/junit/results.xml

      - store_test_results:
          path: test-results

workflows:
  build:
    jobs:
      - build
